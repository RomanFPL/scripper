<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>Video Runner</title>
    <style>
      body {
        width: 360px;
        margin: 0;
        padding: 12px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      .url {
        font-size: 11px;
        color: #666;
        word-break: break-all;
        margin-bottom: 10px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #444;
        margin-bottom: 3px;
      }
      select {
        width: 100%;
        padding: 4px;
        margin-bottom: 10px;
      }
      .buttons {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      button {
        flex: 1;
        padding: 6px 10px;
        cursor: pointer;
      }
      #output,
      #progress {
        white-space: pre-wrap;
        background: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 8px;
        min-height: 80px;
        max-height: 240px;
        overflow-y: auto;
        font-family: ui-monospace, monospace;
        font-size: 11px;
      }
      #progress {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Video Runner</h1>
    <div class="url" id="index-url"></div>

    <div class="buttons">
      <button id="refreshBtn">Refresh list</button>
    </div>

    <label for="scenario">Scenario</label>
    <select id="scenario" disabled>
      <option value="">— load list first —</option>
    </select>

    <div class="buttons">
      <button id="load" disabled>Load scenario</button>
      <button id="run">Run</button>
    </div>

    <div class="buttons">
      <button id="pipeline">Collect → download ALL videos</button>
    </div>

    <div class="buttons">
      <button id="pause" disabled>Pause</button>
      <button id="stop" disabled>Stop</button>
    </div>

    <div id="output">Status: idle.</div>

    <label for="progress">Pipeline / download progress</label>
    <div id="progress">No pipeline runs yet.</div>

    <script src="popup.js"></script>
  </body>
</html>

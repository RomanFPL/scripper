<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>Video Runner</title>
    <style>
      body {
        width: 380px;
        margin: 0;
        padding: 12px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      .url {
        font-size: 11px;
        color: #666;
        word-break: break-all;
        margin-bottom: 10px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #444;
        margin-bottom: 3px;
      }
      select,
      input[type="number"] {
        width: 100%;
        padding: 4px;
        margin-bottom: 10px;
      }
      .buttons {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .buttons button {
        flex: 1;
        padding: 6px 10px;
        cursor: pointer;
      }
      #output,
      #progress {
        white-space: pre-wrap;
        background: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 8px;
        min-height: 80px;
        max-height: 200px;
        overflow-y: auto;
        font-family: ui-monospace, monospace;
        font-size: 11px;
      }
      #sessionTabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 8px;
      }
      .session-tab {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 6px 4px 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #f5f5f5;
        font-size: 11px;
        cursor: pointer;
      }
      .session-tab.active {
        background: #dbeafe;
        border-color: #93c5fd;
        font-weight: 600;
      }
      .session-tab span {
        max-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .session-tab-close {
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 12px;
        color: #666;
        padding: 0 2px;
        line-height: 1;
      }
      .session-tab-close:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      #sessionBlock {
        border: 1px solid #eee;
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 10px;
      }
      #videoList {
        max-height: 140px;
        overflow-y: auto;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 6px 8px;
        margin-bottom: 10px;
      }
      #videoList label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font-weight: normal;
        font-size: 12px;
        color: #1a1a1a;
      }
      #videoList input[type="checkbox"] {
        flex-shrink: 0;
        margin: 0;
      }
      #videoList span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .video-progress-bar {
        width: 56px;
        height: 8px;
        flex-shrink: 0;
        background: #e5e7eb;
        border-radius: 4px;
        overflow: hidden;
      }
      .video-progress-fill {
        height: 100%;
        width: 0%;
        background: #3b82f6;
        transition: width 0.2s ease;
      }
      .video-progress-fill.done {
        background: #22c55e;
      }
      .video-progress-fill.error {
        background: #ef4444;
      }
    </style>
  </head>
  <body>
    <h1>Video Runner</h1>
    <div class="url" id="index-url"></div>

    <div class="buttons">
      <button id="refreshBtn">Refresh list</button>
    </div>

    <label for="scenario">Scenario</label>
    <select id="scenario" disabled>
      <option value="">— load list first —</option>
    </select>

    <div class="buttons">
      <button id="load" disabled>Load scenario</button>
      <button id="collect">Collect links</button>
    </div>

    <div id="output">Status: idle.</div>

    <div id="sessionTabs"></div>

    <div id="sessionBlock" hidden>
      <div class="buttons">
        <button id="selectAll">Select all</button>
        <button id="selectNone">Select none</button>
        <button id="closeSession">Close tab</button>
      </div>

      <div id="videoList"></div>

      <label for="concurrency">Parallel downloads</label>
      <input type="number" id="concurrency" min="1" max="10" value="3" />

      <div class="buttons">
        <button id="pipeline" disabled>Download selected</button>
      </div>

      <div class="buttons">
        <button id="pause" disabled>Pause</button>
        <button id="stop" disabled>Stop</button>
      </div>

      <label for="progress">Progress</label>
      <div id="progress">No pipeline runs yet.</div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
